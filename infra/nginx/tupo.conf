# Tupo — nginx server blocks.
# Copy to /etc/nginx/sites-available/tupo.conf then:
#   sudo ln -s /etc/nginx/sites-available/tupo.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tupo.amashuri.com -d tupo-live.amashuri.com
#
# Two hostnames, on purpose:
#   tupo.amashuri.com       SPA + REST + file transfer
#   tupo-live.amashuri.com  Socket.IO gateway only
#
# The gateway gets its own server block so that long-lived upgraded connections
# never share request buffering, body-size or timeout settings with ordinary
# REST traffic, and so it can be moved to another host later by changing one
# DNS record instead of a proxy path. The browser is told which origin to use
# through VITE_SOCKET_URL at build time; the handshake carries a bearer token
# rather than a cookie, so a cross-origin socket needs nothing but CORS.

server {
    listen 80;
    server_name tupo.amashuri.com;

    root /opt/apps/nga-communication-module/apps/web/dist;
    index index.html;

    client_max_body_size 5g;   # matches MAX_FILE_SIZE_BYTES

    # Tupo's session JWT nests the MIS's own JWT inside it (misToken), which
    # itself carries academic years, terms, grades and the systems list. That
    # easily exceeds nginx's default 8k header buffer, and when it does nginx
    # returns 400 before the request ever reaches the app -- a failure mode
    # that already bit nga-discipline-attendance on the app-switcher flow.
    large_client_header_buffers 8 32k;

    # The client calls same-origin relative paths (fetch('/api/...')), so these
    # proxies are required for the app to work at all.
    location /api/files/ {
        proxy_pass http://127.0.0.1:5192;
        include /etc/nginx/proxy_params;
        proxy_request_buffering off;      # stream large uploads straight through
        proxy_read_timeout 3600s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5190;
        include /etc/nginx/proxy_params;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# ── Realtime gateway ────────────────────────────────────────────────────────
server {
    listen 80;
    server_name tupo-live.amashuri.com;

    large_client_header_buffers 8 32k;

    # Nothing but the gateway is served here. A bare GET / is answered locally
    # so an uptime check or a curious browser gets a cheap 200 instead of being
    # proxied into a Socket.IO handshake it cannot complete.
    location = / {
        add_header Content-Type text/plain;
        return 200 'tupo realtime gateway';
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5191;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived connections must not be culled
        proxy_send_timeout 3600s;
        proxy_buffering off;        # push events out as they are produced
    }

    location /health {
        proxy_pass http://127.0.0.1:5191;
        include /etc/nginx/proxy_params;
    }
}
